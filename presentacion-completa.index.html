<meta charset="utf-8">
<title>Pasillo GRANUTZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alice&family=Arimo:wght@700&family=Fraunces:opsz,wght,SOFT@9..144,400..900,0..100&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F3F0E9;
    --ink-dim:rgba(243,240,233,.8);
    --navy:#173B46;
    --night:#292F31;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--night);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;}

  #app{position:fixed;inset:0;overflow:hidden;
    background:linear-gradient(to bottom,#10262d 0%,#173B46 38%,#23373b 70%,#292F31 100%);}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .shade{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to top,rgba(24,30,32,.78) 0%,rgba(24,30,32,.25) 34%,transparent 55%),
      linear-gradient(to bottom,rgba(24,30,32,.55) 0%,transparent 16%),
      radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(20,26,28,.5) 100%);}
  body.nogl #app{background:radial-gradient(ellipse at 70% 30%,#287A85 0%,transparent 55%),linear-gradient(to bottom,#173B46,#292F31);}

  #loader{position:absolute;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .9s ease .2s,visibility 0s linear 1.1s;}
  #loader.done{opacity:0;visibility:hidden;}
  #loader .logo{font-family:'Alice',Georgia,serif;font-size:46px;letter-spacing:.04em;}
  #loader .bar{width:160px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;}
  #loader .bar i{display:block;height:100%;width:40%;background:var(--ink);border-radius:3px;animation:load 1.1s ease-in-out infinite;}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

  .top{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(14px + env(safe-area-inset-top,0px)) clamp(16px,3vw,32px) 0;pointer-events:none;}
  .brandwrap{display:flex;align-items:center;gap:14px;pointer-events:auto;}
  .brand{display:flex;align-items:center;gap:4px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0;}
  .brand .word{font-family:'Alice',Georgia,serif;font-size:27px;line-height:1;letter-spacing:.03em;}
  .dfly{width:38px;height:38px;flex:none;overflow:visible;}
  .eccichip{display:inline-flex;align-items:center;background:#ffffff;border-radius:8px;padding:5px 9px;box-shadow:0 8px 20px -10px rgba(0,0,0,.5);}
  .eccichip img{display:block;height:26px;width:auto;}
  .logos{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px;opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .6s ease;}
  .tb.on .logos{opacity:1;transform:none;transition-delay:.2s;}
  .glogo{display:flex;align-items:center;gap:6px;color:#F3F0E9;}
  .glogo .dfly{width:62px;height:62px;}
  .glogo span{font-family:'Alice',Georgia,serif;font-size:clamp(30px,3.2vw,44px);letter-spacing:.04em;line-height:1;}
  .logos .eccichip{padding:8px 14px;border-radius:12px;}
  .logos .eccichip img{height:clamp(34px,3.6vw,48px);}
  .logos .sep{width:1px;height:46px;background:rgba(243,240,233,.35);}
  #loader .lockup{display:flex;align-items:center;gap:8px;}
  #loader .lockup .dfly{width:64px;height:64px;}
  .topright{display:flex;align-items:center;gap:16px;pointer-events:auto;}
  .count{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
  .count b{color:var(--ink);}
  .tagbtn{position:relative;border:0;background:none;padding:0;cursor:pointer;width:112px;height:52px;color:var(--navy);transition:transform .3s cubic-bezier(.3,1.6,.5,1);}
  .tagbtn:hover{transform:rotate(-4deg) scale(1.05);}
  .tagbtn svg{position:absolute;inset:0;width:100%;height:100%;}
  .tagbtn span{position:relative;font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:800;font-size:17px;padding-left:14px;}
  .tagbtn:focus-visible,.pill:focus-visible,.navb:focus-visible,.tick:focus-visible,.close:focus-visible,.mitem:focus-visible,.brand:focus-visible,.ph:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}

  .phasebar{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));z-index:21;display:flex;gap:6px;
    transform:translate(-50%,-12px);opacity:0;pointer-events:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.85,.25,1);}
  .phasebar.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .ph{display:flex;align-items:center;gap:7px;border:1px solid rgba(243,240,233,.25);background:rgba(41,47,49,.55);backdrop-filter:blur(8px);
    color:var(--ink-dim);border-radius:30px;padding:4px 12px 4px 4px;font:700 12px/1 'Manrope',sans-serif;cursor:pointer;transition:background .3s,color .3s;white-space:nowrap;}
  .ph b{width:24px;height:24px;border-radius:50%;background:rgba(243,240,233,.14);display:flex;align-items:center;justify-content:center;font-size:12px;font-variant-numeric:tabular-nums;}
  .ph.done b{background:#287A85;color:#F3F0E9;}
  .ph.on{background:#F3F0E9;color:#173B46;border-color:#F3F0E9;}
  .ph.on b{background:#145A68;color:#F3F0E9;}

  .ticks{position:absolute;right:clamp(14px,2.4vw,28px);top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;}
  .tick{width:18px;height:3px;border:0;padding:0;border-radius:2px;background:rgba(243,240,233,.32);cursor:pointer;margin-left:auto;transition:width .4s ease,background .4s ease;}
  .tick.ph5{background:rgba(228,192,76,.55);}
  .tick.on{width:34px;background:var(--ink);}
  .tick:hover{background:rgba(243,240,233,.7);}

  #texts{position:absolute;inset:0;z-index:10;pointer-events:none;}
  .tb{position:absolute;visibility:hidden;}
  .tb.on{visibility:visible;}
  .tb.bl{left:clamp(18px,4vw,60px);bottom:clamp(30px,8vh,80px);max-width:min(700px,calc(100% - 110px));}
  .tb.r{right:clamp(60px,8vw,120px);top:50%;transform:translateY(-50%);max-width:min(470px,calc(100% - 100px));}
  .kick{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:12px;
    opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .6s ease;}
  .hl{margin:0;font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:850;
    font-size:clamp(34px,5vw,72px);line-height:1.02;letter-spacing:-.015em;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.35);}
  .tb.r .hl{font-size:clamp(30px,3.5vw,50px);}
  .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em;}
  .wi{display:inline-block;transform:translateY(110%);transition:transform .35s ease;}
  .tb.on .wi{transform:none;transition:transform .9s cubic-bezier(.2,.85,.25,1) calc(var(--i) * 60ms + 450ms);}
  .sub{margin:16px 0 0;font-size:clamp(15px,1.35vw,18px);line-height:1.55;color:var(--ink-dim);max-width:56ch;
    opacity:0;transform:translateY(10px);transition:opacity .4s ease,transform .5s ease;}
  .pill{margin-top:22px;display:inline-flex;align-items:center;gap:12px;background:#F3F0E9;color:var(--navy);border:0;border-radius:12px;
    padding:6px 16px 6px 6px;cursor:pointer;pointer-events:none;opacity:0;transform:translateY(10px);
    font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:800;font-size:16px;line-height:1.15;text-align:left;
    box-shadow:0 12px 30px -12px rgba(0,0,0,.5);transition:opacity .4s ease,transform .5s ease,box-shadow .3s;}
  .pill:hover{box-shadow:0 16px 40px -10px rgba(0,0,0,.6);}
  .tb.on .kick,.tb.on .sub,.tb.on .pill{opacity:1;transform:none;}
  .tb.on .kick{transition-delay:.35s;}
  .tb.on .sub{transition:opacity .7s ease .95s,transform .8s ease .95s;}
  .tb.on .pill{pointer-events:auto;transition:opacity .7s ease 1.15s,transform .8s cubic-bezier(.3,1.5,.5,1) 1.15s,box-shadow .3s;}
  .thumb{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--tc,#145A68);color:#F3F0E9;}
  .thumb svg{width:24px;height:24px;}
  .thumb.num{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:900;font-size:22px;}
  .thumb.duo{background:none;width:auto;}
  .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:#F3F0E9;border:2px solid #F3F0E9;}
  .av+.av{margin-left:-6px;}
  .pill .arrow{font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;opacity:.55;margin-left:4px;}

  .ctrl{position:absolute;right:clamp(16px,3vw,32px);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:10px;}
  .navb{width:48px;height:48px;border-radius:50%;border:1px solid rgba(243,240,233,.3);background:rgba(41,47,49,.45);backdrop-filter:blur(8px);
    color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s,opacity .25s;}
  .navb:hover{background:rgba(243,240,233,.16);border-color:var(--ink);}
  .navb:disabled{opacity:.3;cursor:default;}
  .navb svg{width:20px;height:20px;}

  #hint{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;
    font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink);background:rgba(41,47,49,.6);backdrop-filter:blur(8px);
    border:1px solid rgba(243,240,233,.18);border-radius:30px;padding:8px 16px;white-space:nowrap;opacity:0;transition:opacity .6s;pointer-events:none;}
  #hint.show{opacity:1;}
  kbd{font-family:inherit;font-weight:800;background:rgba(243,240,233,.14);border-radius:4px;padding:1px 5px;}

  .ov{position:absolute;inset:0;z-index:40;overflow:hidden;color:var(--dink);background:linear-gradient(135deg,var(--g1),var(--g2));
    clip-path:circle(0px at var(--cx,50%) var(--cy,50%));visibility:hidden;
    transition:clip-path .8s cubic-bezier(.7,0,.2,1),visibility 0s linear .8s;}
  .ov.open{clip-path:circle(150vmax at var(--cx,50%) var(--cy,50%));visibility:visible;transition:clip-path .85s cubic-bezier(.7,0,.2,1),visibility 0s;}
  .t-dark{--g1:#173B46;--g2:#145A68;--dink:#F3F0E9;}
  .t-deep{--g1:#145A68;--g2:#287A85;--dink:#F3F0E9;}
  .t-mid{--g1:#287A85;--g2:#173B46;--dink:#F3F0E9;}
  .t-sand{--g1:#B5A28F;--g2:#F3F0E9;--dink:#292F31;}
  .close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:clamp(16px,3vw,32px);z-index:5;width:44px;height:44px;border-radius:50%;border:0;
    background:#F3F0E9;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);
    transition:transform .3s cubic-bezier(.3,1.6,.5,1);}
  .close:hover{transform:rotate(90deg);}
  .close svg{width:18px;height:18px;}

  .floaters{position:absolute;inset:0;pointer-events:none;z-index:1;}
  .fl{position:absolute;transition:transform .6s ease-out;transform:translate(calc(var(--px,0) * var(--d) * 34px),calc(var(--py,0) * var(--d) * 22px));}
  .fi{animation:bob var(--t,7s) ease-in-out infinite alternate;}
  @keyframes bob{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(var(--dx,8px),var(--dy,-14px)) rotate(var(--r,18deg))}}
  .ring{width:var(--s);height:var(--s);border-radius:50%;
    background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.7) 0 8%,transparent 30%),radial-gradient(circle at 60% 70%,rgba(0,0,0,.25),transparent 60%),var(--c);
    -webkit-mask:radial-gradient(circle,transparent 27%,#000 29%);mask:radial-gradient(circle,transparent 27%,#000 29%);filter:drop-shadow(0 10px 12px rgba(0,0,0,.25));}
  .pack{width:calc(var(--s) * .7);height:var(--s);border-radius:6px;background:linear-gradient(180deg,rgba(0,0,0,.18) 0 16%,transparent 16% 84%,rgba(0,0,0,.14) 84%),var(--c);
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 12px 16px -6px rgba(0,0,0,.3);position:relative;}
  .pack::after{content:"";position:absolute;left:16%;right:16%;top:34%;height:30%;border-radius:4px;background:rgba(255,255,255,.75);}

  .dgrid{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,80px);align-items:center;
    padding:calc(84px + env(safe-area-inset-top,0px)) clamp(18px,5vw,80px) calc(34px + env(safe-area-inset-bottom,0px));}
  .dvis{position:relative;display:flex;justify-content:center;align-items:center;}
  .shot{margin:0;width:min(100%,420px);aspect-ratio:4/5;border-radius:16px;overflow:hidden;transform:rotate(-4deg);box-shadow:0 30px 60px -20px rgba(0,0,0,.45);background:#292F31;}
  .shot img{width:100%;height:100%;object-fit:cover;display:block;}
  .ov.open .shot{animation:cardIn 1s cubic-bezier(.2,.9,.25,1.15) .35s both;}
  @keyframes cardIn{0%{transform:rotate(6deg) translateY(40px) scale(.9);opacity:0}100%{transform:rotate(-4deg);opacity:1}}
  .doodle{position:absolute;right:-6%;bottom:-8%;width:52%;max-width:230px;color:var(--dink);opacity:.95;}
  .doodle path,.doodle circle{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
  .ov.open .doodle path,.ov.open .doodle circle{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.6s ease .8s forwards;}
  @keyframes draw{to{stroke-dashoffset:0}}

  .dbody{max-height:calc(100vh - 130px);overflow:auto;padding-right:8px;scrollbar-width:thin;}
  .ov.open .dbody>*{animation:rise .8s cubic-bezier(.2,.85,.25,1) both;}
  .ov.open .dbody>*:nth-child(1){animation-delay:.35s}
  .ov.open .dbody>*:nth-child(2){animation-delay:.45s}
  .ov.open .dbody>*:nth-child(3){animation-delay:.55s}
  .ov.open .dbody>*:nth-child(4){animation-delay:.65s}
  .ov.open .dbody>*:nth-child(n+5){animation-delay:.75s}
  @keyframes rise{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
  .deye{font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-bottom:10px;}
  .dbody h2{margin:0 0 18px;font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:850;font-size:clamp(32px,4vw,58px);line-height:1;letter-spacing:-.015em;text-wrap:balance;}
  .dbody p{font-size:16px;line-height:1.6;margin:0 0 14px;max-width:62ch;}
  .dbody strong{font-weight:800;}
  .dbody .note{font-size:12.5px;opacity:.75;}
  .dl{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:11px;max-width:64ch;}
  .dl li{position:relative;padding-left:22px;font-size:15.5px;line-height:1.55;}
  .dl li::before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:50%;border:2.5px solid currentColor;}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:4px 0 18px;max-width:620px;}
  .stat{border-radius:12px;padding:14px 14px 12px;background:color-mix(in srgb,var(--dink) 14%,transparent);}
  .stat b{display:block;font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:900;font-size:clamp(28px,3.2vw,44px);line-height:1;font-variant-numeric:tabular-nums;}
  .stat span{display:block;margin-top:6px;font-size:12.5px;line-height:1.35;opacity:.9;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;}
  .chip{font-size:13px;font-weight:700;border-radius:30px;padding:6px 12px;background:color-mix(in srgb,var(--dink) 16%,transparent);}
  .chip.solid{background:var(--dink);color:var(--g1);}
  .t-sand .chip.solid{color:#F3F0E9;}
  .clabel{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin:6px 0 8px;}
  .cards3,.cards2{display:grid;gap:12px;margin-bottom:14px;}
  .cards3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .cards2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:640px;}
  .c3{border-radius:12px;padding:16px;background:color-mix(in srgb,var(--dink) 12%,transparent);}
  .c3 h4{margin:0 0 8px;font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:800;font-size:19px;}
  .c3 p,.c3 li{font-size:13.5px !important;line-height:1.5 !important;margin:0;}
  .c3 ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px;}
  .c3 .n{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;background:var(--dink);color:var(--g1);
    font:900 12.5px/1 'Fraunces',Georgia,serif;margin-bottom:8px;}
  .steps{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:13px;max-width:66ch;}
  .steps li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;font-size:15px;line-height:1.55;}
  .sn{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:900;font-size:15px;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;background:var(--dink);color:var(--g1);font-variant-numeric:tabular-nums;}
  .t-sand .sn,.t-sand .c3 .n{color:#F3F0E9;}
  .steps b{display:block;font-weight:800;font-size:16px;}
  .steps small{display:block;font-size:13.5px;opacity:.88;margin-top:3px;line-height:1.5;}
  .quote{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:600;font-size:clamp(19px,1.9vw,25px);line-height:1.38;margin:0 0 18px;max-width:42ch;}
  .strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 18px;font-size:13px;font-weight:800;}
  .strip span.s{border:2px solid currentColor;border-radius:30px;padding:5px 11px;}
  .strip span.a{opacity:.7;}
  .people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:6px 0 14px;max-width:640px;}
  .person{display:flex;gap:12px;align-items:center;border-radius:12px;padding:12px;background:color-mix(in srgb,var(--dink) 12%,transparent);min-width:0;}
  .person .av{flex:none;width:44px;height:44px;border-color:var(--dink);}
  .person div{min-width:0;}
  .person b{display:block;font-size:14.5px;line-height:1.25;}
  .person div span{display:block;font-size:12px;opacity:.85;overflow-wrap:anywhere;margin-top:2px;}
  .person .av{font-size:14px;line-height:1;padding:0;}
  .viz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px;margin:0 0 8px;}
  .vcol{border-radius:12px;padding:14px;background:color-mix(in srgb,var(--dink) 12%,transparent);}
  .vcol b{font-size:14px;}
  .vcol small{display:block;font-size:12.5px;opacity:.85;}
  .slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0;}
  .slots i{aspect-ratio:1;border-radius:6px;background:var(--dink);}
  .slots i.e{background:transparent;border:2px dashed currentColor;opacity:.55;}
  .tl{list-style:none;margin:0 0 14px;padding:0;max-width:62ch;}
  .tl li{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:16px;padding:12px 0;border-top:1px solid color-mix(in srgb,var(--dink) 25%,transparent);align-items:baseline;}
  .tl .yr{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:900;font-size:22px;line-height:1.1;}
  .tl b{display:block;font-size:15.5px;}
  .tl small{display:block;font-size:13.5px;opacity:.88;line-height:1.5;margin-top:2px;}
  .ktable{max-width:640px;margin:0 0 14px;}
  .krow{display:grid;grid-template-columns:minmax(140px,.8fr) 1.2fr;gap:14px;padding:9px 0;border-top:1px solid color-mix(in srgb,var(--dink) 25%,transparent);font-size:14px;line-height:1.45;}
  .krow b{font-weight:800;}

  #menu .mwrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;

  function makeFlow(id, pts){

    var total = cum[cum.length - 1], gap = 0.55, n = Math.max(2, Math.floor(total / gap));
    var pos = new Float32Array(n * 3);
    var geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var pts3 = new THREE.Points(geo, new THREE.PointsMaterial({color:0xe4c04c, size:0.2, transparent:true, opacity:0.95, depthWrite:false}));
    var lg = new THREE.BufferGeometry().setFromPoints(pts.map(function(p){ return new THREE.Vector3(p[0], 0.04, p[1]); }));
    var line = new THREE.Line(lg, new THREE.LineBasicMaterial({color:0xe4c04c, transparent:true, opacity:0.35}));
    pts3.visible = line.visible = false;
    scene.add(pts3); scene.add(line);
    flows[id] = {pts:pts, cum:cum, total:total, gap:gap, n:n, pos:pos, obj:pts3, line:line};
  }
  function updateFlows(t){

      var off = (t * 1.3) % f.gap, seg = 1;
      for (var k = 0; k < f.n; k++){
        var s = (k * f.gap + off) % f.total;
        seg = 1; while (seg < f.cum.length - 1 && f.cum[seg] < s) seg++;
        var a = f.pts[seg - 1], b = f.pts[seg], u = (s - f.cum[seg - 1]) / Math.max(0.0001, f.cum[seg] - f.cum[seg - 1]);
        f.pos[k * 3] = a[0] + (b[0] - a[0]) * u; f.pos[k * 3 + 1] = 0.08; f.pos[k * 3 + 2] = a[1] + (b[1] - a[1]) * u;
      }
      f.obj.geometry.attributes.position.needsUpdate = true;
    });
  }

  function roomW1(x){ return x < 0 ? 'B' : 'E'; }
  function routeW1(p, stops){
    var path = [], cur = [p.g.position.x, p.g.position.z];
    stops.forEach(function(key){
      var st = STATIONS.W1[key];
      if (roomW1(cur[0]) !== roomW1(st[0])){
        var dz = Math.abs(cur[1] - DOOR_A) + Math.abs(st[1] - DOOR_A) <= Math.abs(cur[1] - DOOR_B) + Math.abs(st[1] - DOOR_B) ? DOOR_A : DOOR_B;
        var s1 = cur[0] < 0 ? -1 : 1;
        path.push([s1 * 0.9, dz], [-s1 * 0.9, dz]);
      }
      path.push([st[0], st[1]]);
      cur = [st[0], st[1]];
    });
    return path;
  }
  function sendPerson(p, spec){
    var stops = spec[0], emo = spec[1] || null, carry = spec[2] || null, work = !!spec[3];
    if (!Array.isArray(stops)) stops = [stops];
    var last = stops[stops.length - 1];
    if (p.key === 'S' && last === 'door' && !(truck && truck.userData.state === 'store' && !truck.userData.path.length)){ p.want = spec; last = 'counter'; stops = ['counter']; }
    else p.want = null;
    var sig = stops.join('>') + '|' + carry;
    if (p.at !== sig){
      p.at = sig;
      var table = STATIONS[p.key];
      p.path = p.key === 'W1' ? routeW1(p, stops) : stops.map(function(k){ return [table[k][0], table[k][1]]; });
      p.face = table[last][2];
      p.carry = carry;
      if (reduce){ var e = p.path[p.path.length - 1]; p.g.position.set(e[0], 0, e[1]); p.path = []; p.heading = p.face; }
    }
    p.work = work;
    setEmo(p, emo);
  }
  function setEmo(p, emo){
    if (p.emo === emo) return;
    p.emo = emo;
    if (emo){ p.bubble.material.map = bubbleTex(emo); p.bubble.material.needsUpdate = true; p.bubble.visible = true; p.bubbleT = 0; }
    else p.bubble.visible = false;
  }
  function angLerp(a, b, t){ var d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI; return a + d * t; }
  function updatePerson(p, dt, t){
    if (p.want && truck.userData.state === 'store' && !truck.userData.path.length){ var w = p.want; p.want = null; p.at = null; sendPerson(p, w); }
    var pos = p.g.position;
    if (p.path.length){
      var tgt = p.path[0], dx = tgt[0] - pos.x, dz = tgt[1] - pos.z, d = Math.sqrt(dx * dx + dz * dz), step = 1.45 * dt;
      if (d <= step){ pos.x = tgt[0]; pos.z = tgt[1]; p.path.shift(); }
      else { pos.x += dx / d * step; pos.z += dz / d * step; p.heading = angLerp(p.heading, Math.atan2(dx, dz), Math.min(1, dt * 10)); }
      p.moving = true; p.walk += dt * 7.5;
    } else {
      p.moving = false;
      p.heading = angLerp(p.heading, p.face, Math.min(1, dt * 5));
    }
    p.g.rotation.y = p.heading;
    var sw = p.moving ? Math.sin(p.walk) : 0;
    p.legs[0].rotation.x = sw * 0.55; p.legs[1].rotation.x = -sw * 0.55;
    var carrying = p.carry && p.moving;
    p.props.sack.visible = carrying && p.carry === 'sack';
    p.props.box.visible = carrying && p.carry === 'box';
    var target0, target1;
    if (carrying){ target0 = target1 = -1.05; }
    else if (p.moving){ target0 = -sw * 0.5; target1 = sw * 0.5; }
    else if (p.work){ target0 = -0.95 + Math.sin(t * 6) * 0.25; target1 = -0.95 - Math.sin(t * 6) * 0.25; }
    else { target0 = target1 = -0.1; }
    p.arms[0].rotation.x += (target0 - p.arms[0].rotation.x) * Math.min(1, dt * 8);
    p.arms[1].rotation.x += (target1 - p.arms[1].rotation.x) * Math.min(1, dt * 8);
    p.arms[0].rotation.z = -0.08; p.arms[1].rotation.z = 0.08;
    pos.y = p.moving ? Math.abs(Math.sin(p.walk)) * 0.035 : 0;
    if (p.bubble.visible){
      p.bubbleT = Math.min(1, p.bubbleT + dt * 2.5);
      var e = p.bubbleT, s = (e < 1 ? (1 - Math.pow(1 - e, 3)) * (1 + 0.25 * Math.sin(e * Math.PI)) : 1) * 1.0;
      p.bubble.scale.set(s, s, 1);
      p.bubble.position.y = 2.5 + Math.sin(t * 2 + p.key.length) * 0.04;
    }
  }

  /* =================== TRUCK =================== */
  function setTruckPose(state){
    var ps = TRUCK_POSE[state];
    truck.position.set(ps[0], 0, ps[1]); truck.userData.heading = ps[2]; truck.rotation.y = ps[2];
    truck.userData.state = state; truck.userData.path = [];
  }
  function startTrip(u, key, state){ u.path = TRUCK_PATH[key].map(function(p){ return p.slice(); }); u.state = state; u.pendingTo = null; }
  // waitLoad: en el paso 5 el camión espera a que el bodeguero llegue al muelle con la caja antes de salir.
  function truckTo(state, waitLoad){
    var u = truck.userData;
    if (u.pendingTo){
      if (u.pendingTo === state){ if (!waitLoad) startTrip(u, 'bodega>store', state); return; }
      u.pendingTo = null;
    }
    if (u.state === state && !u.path.length) return;
    var key = u.state + '>' + state;
    if (!reduce && TRUCK_PATH[key] && !u.path.length){
      if (waitLoad && key === 'bodega>store'){ u.pendingTo = state; u.wait = 0; return; }
      startTrip(u, key, state);
    }
    else setTruckPose(state);
  }
  function updateTruck(dt){
    var u = truck.userData, pos = truck.position;
    if (u.pendingTo){
      var w = people.W1;
      if (w && !w.path.length && w.at && /(^|>)dock\|/.test(w.at)){ u.wait += dt; if (u.wait > 1.4) startTrip(u, 'bodega>store', u.pendingTo); }
    }
    if (u.path.length){
      var tgt = u.path[0], dx = tgt[0] - pos.x, dz = tgt[1] - pos.z, d = Math.sqrt(dx * dx + dz * dz);
      var rev = !!tgt[2], speed = rev ? 2.2 : 7.5, step = speed * dt;
      var want = rev ? Math.atan2(dx, dz) : Math.atan2(-dx, -dz);
      if (d > 0.05) u.heading = angLerp(u.heading, want, Math.min(1, dt * 3.2));
      if (d <= step){ pos.x = tgt[0]; pos.z = tgt[1]; u.path.shift(); }
      else { pos.x += dx / d * step; pos.z += dz / d * step; }
      truck.rotation.y = u.heading;
      u.wheels.forEach(function(wh){ wh.rotation.x += (rev ? 1 : -1) * Math.min(step, d) / 0.42; });
      if (!u.path.length){ u.heading = TRUCK_POSE[u.state][2]; truck.rotation.y = u.heading; }
    }
    dropBodega.visible = u.state === 'bodega' && !u.path.length;
    dropStore.visible = u.state === 'store' && !u.path.length;
  }

  /* =================== CAMERA =================== */
  var V = function(a){ return new THREE.Vector3(a[0], a[1], a[2]); };
  var cam = null;
  var mouse = {x:0, y:0, sx:0, sy:0};
  function initCam(i){ var s = SLIDES[i].shot; cam = {pos:V(s.p), tgt:V(s.t), from:{p:V(s.p), t:V(s.t)}, to:{p:V(s.p), t:V(s.t)}, start:0, dur:1, lift:0, done:true}; }
  function flyTo(i){
    var s = SLIDES[i].shot, prev = SLIDES[curSlide] ? SLIDES[curSlide].shot : s;
    cam.from = {p:cam.pos.clone(), t:cam.tgt.clone()};
    cam.to = {p:V(s.p), t:V(s.t)};
    var dist = cam.from.p.distanceTo(cam.to.p);
    var cap = Math.min(s.lift !== undefined ? s.lift : 4, prev.lift !== undefined ? prev.lift : 4);
    cam.lift = Math.min(cap, Math.max(0.5, dist * 0.14));
    cam.dur = reduce ? 500 : Math.min(3200, 1800 + dist * 40);
    cam.start = performance.now(); cam.done = false;
  }
  function ease(t){ return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  var tmpF, tmpR, tmpU, WUP, lastT = 0;
  var firstFrame = true, captureSoon = false, covered = false, coverTimer = null;
  function snap(){
    var w = 720, h = Math.round(720 * canvas.height / canvas.width);
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#10262d'); gr.addColorStop(0.38, '#173B46'); gr.addColorStop(0.7, '#23373b'); gr.addColorStop(1, '#292F31');
    g.fillStyle = gr; g.fillRect(0, 0, w, h); g.drawImage(canvas, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.82);
  }
  function frame(now){
    requestAnimationFrame(frame);
    if (!renderer) return;
    var dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
    if (!cam.done){
      var k = Math.min(1, (now - cam.start) / cam.dur), e = ease(k);
      cam.pos.lerpVectors(cam.from.p, cam.to.p, e); cam.pos.y += Math.sin(Math.PI * e) * cam.lift;
      cam.tgt.lerpVectors(cam.from.t, cam.to.t, e);
      if (k >= 1){ cam.done = true; captureSoon = true; }
    }
    mouse.sx += (mouse.x - mouse.sx) * 0.035; mouse.sy += (mouse.y - mouse.sy) * 0.035;
    var t = now / 1000, amp = reduce ? 0 : 1;
    tmpF.subVectors(cam.tgt, cam.pos).normalize();
    tmpR.crossVectors(tmpF, WUP).normalize();
    tmpU.crossVectors(tmpR, tmpF).normalize();
    var scale = Math.max(0.6, Math.min(3, cam.pos.y / 5));
    var ox = (Math.sin(t * 0.13) * 0.16 * amp + mouse.sx * 0.35) * scale;
    var oy = (Math.sin(t * 0.17 + 1.3) * 0.09 * amp - mouse.sy * 0.2) * scale;
    var of = Math.sin(t * 0.09) * 0.14 * amp * scale;
    camera.position.copy(cam.pos).addScaledVector(tmpR, ox).addScaledVector(tmpU, oy).addScaledVector(tmpF, of);
    camera.lookAt(cam.tgt.clone().addScaledVector(tmpR, ox * 0.35).addScaledVector(tmpU, oy * 0.35));

    updateTruck(dt);
    Object.keys(people).forEach(function(k){ updatePerson(people[k], dt, t); });
    updateFlows(t);
    markers.forEach(function(m, i){
      var active = SLIDES[curSlide] && SLIDES[curSlide].phase === i + 1;
      var s = active ? 0.62 + Math.sin(t * 3) * 0.05 : 0.42;
      m.scale.set(s, s, 1); m.material.opacity = active ? 1 : 0.7;
    });
    if (dust && !reduce){
      for (var i = 0; i < dustPos.length; i += 3){
        dustPos[i + 1] += 0.0012 + Math.sin(t + i) * 0.0005; dustPos[i] += Math.sin(t * 0.3 + i) * 0.0006;
        if (dustPos[i + 1] > 2.7) dustPos[i + 1] = 0.3;
      }
      dust.geometry.attributes.position.needsUpdate = true;
    }
    if (covered) return;
    renderer.render(scene, camera);
    if (firstFrame){ firstFrame = false; $('loader').classList.add('done'); }
    if (captureSoon){ captureSoon = false; try { shots[curSlide] = snap(); } catch (err) {} }
  }
  function resize(){
    if (!renderer) return;
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = w / h < 1 ? 68 : 50; camera.updateProjectionMatrix();
  }

  function applyWorld(i){
    if (!renderer) return;
    var s = SLIDES[i], ppl = s.ppl || {};
    truckTo(s.truck || 'away', s.phase === 3);
    var defaults = {W1:['idle'], W2:['table'], S:['counter'], C:['browse']};
    Object.keys(people).forEach(function(k){ sendPerson(people[k], ppl[k] || defaults[k]); });
    Object.keys(flows).forEach(function(id){ var on = (s.flows || []).indexOf(+id) >= 0; flows[id].obj.visible = flows[id].line.visible = on; });
    laptop.material.map = laptop.userData[s.screen === 'excel' ? 'excel' : 'app']; laptop.material.needsUpdate = true;
  }

  /* =================== NAVIGATION =================== */
  var steps = [];
  SLIDES.forEach(function(s, i){ steps.push({s:i, d:false}); steps.push({s:i, d:true}); });
  var step = 0, curSlide = -1, detailOpen = false, menuOpen = false;

  function setSlide(i){
    if (hasGL && renderer){ if (curSlide < 0) initCam(i); else flyTo(i); }
    var s = SLIDES[i];
    tbs.forEach(function(el, k){ el.classList.toggle('on', k === i); el.setAttribute('aria-hidden', k === i ? 'false' : 'true'); });
    tickEls.forEach(function(el, k){ el.classList.toggle('on', k === i); });
    mitems.forEach(function(el, k){ el.classList.toggle('cur', k === i); });
    $('cur').textContent = String(i + 1).padStart(2, '0');
    phasebar.classList.toggle('on', i >= FIRST_PHASE - 1 && i <= FIRST_PHASE + 4);
    phEls.forEach(function(el, k){ el.classList.toggle('on', s.phase === k + 1); el.classList.toggle('done', !!s.phase && k + 1 < s.phase); });
    curSlide = i;
    applyWorld(i);
  }
  function origin(el){
    if (!el) return ['50%', '50%'];
    var r = el.getBoundingClientRect();
    if (!r.width) return ['50%', '50%'];
    return [(r.left + r.width / 2) + 'px', (r.top + r.height / 2) + 'px'];
  }
  function openDetail(){
    var s = SLIDES[curSlide], o = origin(tbs[curSlide].querySelector('.pill'));
    detail.style.setProperty('--cx', o[0]); detail.style.setProperty('--cy', o[1]);
    detail.className = 'ov t-' + s.theme;
    dbody.innerHTML = s.detail; dbody.scrollTop = 0;
    var src = shots[curSlide];
    if (!src && renderer){ try { renderer.render(scene, camera); src = snap(); } catch (err) {} }
    if (src) shotImg.src = src;
    makeFloaters($('dfloat'), 9);
    void detail.offsetWidth;
    detail.classList.add('open'); detailOpen = true;
    clearTimeout(coverTimer); coverTimer = setTimeout(function(){ covered = true; }, 900);
  }
  function closeDetail(){
    if (!detailOpen) return;
    detail.classList.remove('open'); detailOpen = false;
    if (!menuOpen){ clearTimeout(coverTimer); covered = false; }
  }
  function openMenu(){
    var o = origin($('menuBtn'));
    menu.style.setProperty('--cx', o[0]); menu.style.setProperty('--cy', o[1]);
    menu.classList.add('open'); menuOpen = true;
    clearTimeout(coverTimer); coverTimer = setTimeout(function(){ covered = true; }, 900);
  }
  function closeMenu(){
    if (!menuOpen) return;
    menu.classList.remove('open'); menuOpen = false;
    if (!detailOpen){ clearTimeout(coverTimer); covered = false; }
  }
  function go(n){
    n = Math.max(0, Math.min(steps.length - 1, n));
    var st = steps[n];
    closeMenu();
    if (!st.d) closeDetail();
    if (st.s !== curSlide) setSlide(st.s);
    if (st.d && !detailOpen) openDetail();
    step = n;
    $('prevBtn').disabled = step === 0;
    $('nextBtn').disabled = step === steps.length - 1;
  }
  function next(){ go(step + 1); }
  function prev(){ go(step - 1); }
  function nextScene(){ go((curSlide + 1) * 2); }
  function prevScene(){ go(detailOpen ? curSlide * 2 : (curSlide - 1) * 2); }

  $('prevBtn').addEventListener('click', function(e){ e.currentTarget.blur(); prev(); });
  $('nextBtn').addEventListener('click', function(e){ e.currentTarget.blur(); next(); });
  $('closeDetail').addEventListener('click', function(e){ e.stopPropagation(); e.currentTarget.blur(); go(curSlide * 2); });
  $('closeMenu').addEventListener('click', function(e){ e.stopPropagation(); e.currentTarget.blur(); closeMenu(); });
  $('menuBtn').addEventListener('click', function(e){ e.currentTarget.blur(); menuOpen ? closeMenu() : openMenu(); });
  $('brand').addEventListener('click', function(e){ e.currentTarget.blur(); go(0); });
  canvas.addEventListener('click', function(){ next(); hideHint(); });
  detail.addEventListener('click', function(e){
    if (e.target.closest('button, a')) return;
    if (window.getSelection && window.getSelection().toString()) return;
    next();
  });
  function toggleFs(){
    try {
      var root = document.documentElement;
      if (!document.fullscreenElement){ var p = root.requestFullscreen && root.requestFullscreen(); if (p && p.catch) p.catch(function(){}); }
      else { var q = document.exitFullscreen && document.exitFullscreen(); if (q && q.catch) q.catch(function(){}); }
    } catch (err) {}
  }
  window.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter'){ e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace'){ e.preventDefault(); prev(); }
    else if (k === 'ArrowDown'){ e.preventDefault(); nextScene(); }
    else if (k === 'ArrowUp'){ e.preventDefault(); prevScene(); }
    else if (k === 'Escape'){ if (menuOpen) closeMenu(); else if (detailOpen) go(curSlide * 2); }
    else if (k === 'm' || k === 'M'){ menuOpen ? closeMenu() : openMenu(); }
    else if (k === 'f' || k === 'F'){ toggleFs(); }
    else if (k === 'Home'){ go(0); }
    else if (k === 'End'){ go(steps.length - 2); }
    else return;
    hideHint();
  });
  var tx0 = null, ty0 = null;
  window.addEventListener('touchstart', function(e){ tx0 = e.changedTouches[0].clientX; ty0 = e.changedTouches[0].clientY; }, {passive:true});
  window.addEventListener('touchend', function(e){
    if (tx0 === null) return;
    var dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4){ dx < 0 ? next() : prev(); }
    tx0 = null;
  }, {passive:true});
  window.addEventListener('mousemove', function(e){
    mouse.x = (e.clientX / window.innerWidth - 0.5) * 2; mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
    var px = mouse.x.toFixed(3), py = mouse.y.toFixed(3);
    detail.style.setProperty('--px', px); detail.style.setProperty('--py', py);
    menu.style.setProperty('--px', px); menu.style.setProperty('--py', py);
  });
  var hint = $('hint');
  function hideHint(){ hint.classList.remove('show'); }

  /* =================== BOOT =================== */
  function boot(){
    if (hasGL){
      try {
        buildWorld();
        tmpF = new THREE.Vector3(); tmpR = new THREE.Vector3(); tmpU = new THREE.Vector3(); WUP = new THREE.Vector3(0, 1, 0);
        resize(); window.addEventListener('resize', resize);
      } catch (err) { if (window.console) console.error(err); renderer = null; hasGL = false; people = {}; truck = null; }
    }
    if (!hasGL){ document.body.classList.add('nogl'); $('loader').classList.add('done'); }
    go(0);
    if (hasGL) requestAnimationFrame(frame);
    setTimeout(function(){ hint.classList.add('show'); }, 1800);
    setTimeout(hideHint, 9000);
  }
  var fontsReady = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load('800 60px Fraunces'), document.fonts.load('700 20px Manrope'), document.fonts.load('40px Alice'), document.fonts.load('700 20px Arimo')])
    : Promise.resolve();
  Promise.race([fontsReady, new Promise(function(r){ setTimeout(r, 2500); })]).then(boot, boot);
})();
</script>
